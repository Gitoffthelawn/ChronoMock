<!-- The one 404 document for the whole site, because GitHub Pages serves this same file
     for a missing address under every language directory. It cannot know which language the
     reader was in, so it says its one sentence in English and then offers every language's
     home page, each in its own name. The list is made by the generator from site.json (the
     language_homes token), so a language added there appears here with no edit. -->

<div class="shell">
  <section class="plain">
    <p class="eyebrow">404</p>
    <h2>That page is not here</h2>
    <p class="sub">
      The address may have been mistyped, or it may be something this site never had.
      Start from the <a href="/">home page</a>.
    </p>

    <ul class="homes">
{{language_homes}}    </ul>
  </section>
</div>
